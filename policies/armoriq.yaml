version: v1

identity:
  api_key: $ARMORIQ_API_KEY

environment: sandbox

mcp_servers: []

policy:
  allow:
    - mcp_scholarship_tool.search_scholarships
    - mcp_scholarship_tool.check_eligibility
    - mcp_scholarship_tool.prepare_application
    - mcp_scholarship_tool.submit_application
  deny: []

intent:
  ttl_seconds: 300
  require_csrg: true